name: Reusable CD - Deploy Artifact

on:
  workflow_call:
    inputs:
      environment_name:
        description: Target GitHub environment
        required: true
        type: string
      artifact_name:
        description: Immutable artifact name produced by CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment_name }}
    steps:
      - name: Download the exact CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: incoming

      - name: Verify package checksum
        working-directory: incoming
        run: sha256sum --check app-package.tar.gz.sha256

      - name: Prepare deployment payload
        run: |
          mkdir -p "release/${{ inputs.environment_name }}"
          tar -xzf incoming/app-package.tar.gz -C "release/${{ inputs.environment_name }}"
          cp incoming/app-package.tar.gz.sha256 "release/${{ inputs.environment_name }}/"
          printf 'environment=%s\nartifact=%s\ncommit=%s\n' \
            "${{ inputs.environment_name }}" \
            "${{ inputs.artifact_name }}" \
            "${{ github.sha }}" > "release/${{ inputs.environment_name }}/deployment-manifest.txt"

      - name: Deployment summary
        run: |
          echo "## Deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ inputs.environment_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: ${{ inputs.artifact_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checksum: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "This capstone demonstrates a deployment hand-off. Connect your actual hosting platform in this step for a live application deployment."
