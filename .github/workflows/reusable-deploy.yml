name: Reusable CD - Deploy Artifact to EC2

on:
  workflow_call:
    inputs:
      environment_name:
        description: Target GitHub environment
        required: true
        type: string
      artifact_name:
        description: Immutable artifact name produced by CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment_name }}
    concurrency:
      group: deploy-${{ inputs.environment_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout deployment script from this commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the exact CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: incoming

      - name: Verify package checksum
        working-directory: incoming
        run: sha256sum --check app-package.tar.gz.sha256

      - name: Validate deployment configuration
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT }}
          APP_PORT: ${{ vars.APP_PORT }}
          HEALTHCHECK_PATH: ${{ vars.HEALTHCHECK_PATH }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured in the ${{ inputs.environment_name }} environment"
              exit 1
            fi
          done
          : "${EC2_SSH_PORT:=22}"
          : "${APP_PORT:=8000}"
          : "${HEALTHCHECK_PATH:=/health}"
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::EC2_HOST must be an IP address or DNS hostname"; exit 1; }
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]] || { echo "::error::EC2_USER has an invalid format"; exit 1; }
          [[ "$EC2_SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( EC2_SSH_PORT >= 1 && EC2_SSH_PORT <= 65535 )) || exit 1
          [[ "$APP_PORT" =~ ^[0-9]{1,5}$ ]] && (( APP_PORT >= 1 && APP_PORT <= 65535 )) || exit 1
          [[ "$HEALTHCHECK_PATH" =~ ^/[A-Za-z0-9/_-]*$ ]] || { echo "::error::HEALTHCHECK_PATH has an invalid format"; exit 1; }

      - name: Deploy to EC2 and verify health
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT }}
          APP_PORT: ${{ vars.APP_PORT }}
          HEALTHCHECK_PATH: ${{ vars.HEALTHCHECK_PATH }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          EC2_SSH_PORT="${EC2_SSH_PORT:-22}"
          APP_PORT="${APP_PORT:-8000}"
          HEALTHCHECK_PATH="${HEALTHCHECK_PATH:-/health}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

          scp -i ~/.ssh/deploy_key -P "$EC2_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            incoming/app-package.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/app-package-${{ github.sha }}.tar.gz"
          scp -i ~/.ssh/deploy_key -P "$EC2_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/deploy_ec2.sh \
            "$EC2_USER@$EC2_HOST:/tmp/deploy_ec2-${{ github.sha }}.sh"

          ssh -i ~/.ssh/deploy_key -p "$EC2_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo bash /tmp/deploy_ec2-${{ github.sha }}.sh /tmp/app-package-${{ github.sha }}.tar.gz ${{ github.sha }} ${{ inputs.environment_name }} $APP_PORT $HEALTHCHECK_PATH"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## EC2 deployment successful"
            echo "- Environment: ${{ inputs.environment_name }}"
            echo "- Artifact: ${{ inputs.artifact_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Health check: passed"
          } >> "$GITHUB_STEP_SUMMARY"
